name: Deploy static demo to GitHub Pages

# Builds the frontend as a backend-free static demo (VITE_STATIC_DATA=true, served
# from public/data/ JSON snapshots) and publishes it to the gh-pages branch, which
# GitHub serves at https://damyarpro.github.io/blogroadeep/. The branch-based
# publish is used (instead of actions/deploy-pages) because creating the gh-pages
# branch auto-enables Pages, while the workflow token is not allowed to enable
# Pages through the API. The normal Django-backed dev/prod build is untouched.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build static demo
        working-directory: frontend
        env:
          VITE_STATIC_DATA: 'true'
          VITE_BASE: /blogroadeep/
        run: npm run build

      - name: Add .nojekyll
        run: touch frontend/dist/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/dist
          force_orphan: true
